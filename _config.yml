# Site Settings
title: "Grand Lakes Water Districts"
description: "Dedicated to transparency and lawful governance across Grand Lakes MUDs & WCID. We expose conflicts of interest, fight consultant legal abuse, and audit fishy budgets."
url: "https://glwater.github.io"

# Theme Setup
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default" # Clean white background with gray text box elements

# Site Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"      # Makes posts load in clean standalone reading blocks
      author_profile: true  # Activates the left sidebar layout
      sidebar:
        nav: "docs-sidebar" # Connects your left-side menu links
