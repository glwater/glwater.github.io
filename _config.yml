# Site Settings
title: "Grand Lakes Water Districts"
description: "Dedicated to transparency and lawful governance the across Grand Lakes MUDs and WCID. We expose conflicts of interest, fight consultant legal abuse, and audit fishy budgets."
url: "https://glwater.github.io"

# Plugins Configuration (This tells GitHub how to fetch the theme code!)
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Remote Theme Setup
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default" 

# Site Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"      
      author_profile: true  
      sidebar:
        nav: "docs-sidebar" 
