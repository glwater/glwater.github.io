{% if site.ganalytics_id %}
<!-- Google Analytics 4 -->
<script async src="https://googletagmanager.com{{ site.ganalytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Privacy protection configurations
  gtag('config', '{{ site.ganalytics_id }}', {
    'cookie_flags': 'SameSite=None;Secure',
    'anonymize_ip': true
  });
</script>
{% endif %}
