{% if page.mathjax %}
<!-- MathJax Configuration and Loader (v4) -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      processEscapes: true,
      packages: {'[+]': ['ams', 'noundefined']}
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    loader: {
      load: ['[tex]/ams', '[tex]/noundefined']
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net" crossorigin="anonymous"></script>
{% endif %}

<!-- KaTeX Configuration -->
{% if page.katex %}
<!-- {% if jekyll.environment == "production" %} -->
<!-- Live Production CDN -->
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net" crossorigin="anonymous"> -->
<!-- <script defer src="https://cdn.jsdelivr.net" crossorigin="anonymous"></script>  -->
<!-- {% else %}  -->
<!-- Local Development Assets -->
<link rel="stylesheet" href="{{ '/assets/css/katex.min.css' | relative_url }}">
<script defer src="{{ '/assets/js/katex.min.js' | relative_url }}"></script>
<!-- {% endif %}  -->

<script>
document.addEventListener("DOMContentLoaded", function() {
  function renderLiveKramdownMath() {
    // Wait until local KaTeX asset is fully loaded on the global window scope
    if (typeof window.katex === 'undefined') {
      setTimeout(renderLiveKramdownMath, 30);
      return;
    }

    // Target the exact element Kramdown generates on your live site
    const mathElements = document.querySelectorAll('pre code.language-math');
    
    mathElements.forEach((codeBlock) => {
      let rawTex = codeBlock.textContent.trim();
      if (!rawTex) return;

      // ----- CLEANUP FOR TYPOS -----
      rawTex = rawTex.replace(/\\f\\relax\{([^}]+)\}/g, 'f($1)');
      rawTex = rawTex.replace(/\\f\\hat/g, '\\hat');
      rawTex = rawTex.replace(/\\f\s*([xX])/g, 'f$1');
      // ------------------------------------------------

      // Create a clean container for KaTeX to render into
      const container = document.createElement('div');
      container.className = "rendered-markdown-math";
      container.style.textAlign = "center";
      container.style.margin = "1.8rem 0";
      container.style.width = "100%";
      container.style.overflowX = "auto";

      try {
        // Render raw TeX string via local KaTeX engine
        window.katex.render(rawTex, container, {
          displayMode: true,
          throwOnError: false
        });

        // Find the outermost container element (<pre>) to swap entirely
        const preTag = codeBlock.closest('pre');
        if (preTag && preTag.parentNode) {
          preTag.parentNode.replaceChild(container, preTag);
        }
      } catch (err) {
        console.error("Local Math Parser Error: ", err);
      }
    });
  }

  renderLiveKramdownMath();
});
</script>
{% endif %}
