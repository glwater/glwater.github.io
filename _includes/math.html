{% if page.mathjax %}
<!-- MathJax Configuration and Loader (v4) -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      processEscapes: true,
      packages: {'[+]': ['ams', 'noundefined']}
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    loader: {
      load: ['[tex]/ams', '[tex]/noundefined']
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net" crossorigin="anonymous"></script>
{% endif %}

<!-- KaTeX Configuration -->
{% if page.katex %}
    <link rel="stylesheet" href="{{ '/assets/css/katex.min.css' | relative_url }}">
    <script defer src="{{ '/assets/js/katex.min.js' | relative_url }}"></script>
    <!-- Add the KaTeX auto-render extension to your local assets if available, or call the fallback render below -->
    
<script>
document.addEventListener("DOMContentLoaded", function() {
  function renderLiveSiteMath() {
    // Wait until defer-loaded KaTeX library is fully ready on the window global scope
    if (typeof window.katex === 'undefined') {
      setTimeout(renderLiveSiteMath, 30);
      return;
    }

    // Target the actual text blocks where Kramdown prints your math formulas on the live site
    // This looks for raw text blocks containing math characters or standard paragraph/div layouts
    const paragraphs = document.querySelectorAll('main p, main div');
    
    paragraphs.forEach((el) => {
      let rawText = el.innerHTML;
      
      // Match formulas wrapped in $$ symbols natively outputted by Kramdown
      if (rawText.includes('$$')) {
        // ----- CLEANUP TYPOS -----
        rawText = rawText.replace(/\\f\\relax\{([^}]+)\}/g, 'f($1)');
        rawText = rawText.replace(/\\f\\hat/g, '\\hat');
        rawText = rawText.replace(/\\f\s*([xX])/g, 'f$1');
        // ------------------------------------------------

        // Replace the element's content by processing the math string natively via KaTeX
        // If your theme compiles $$ blocks into custom layout tags, you can also inject the auto-render script below
        el.innerHTML = rawText;
      }
    });

    // Native fallback engine execution to capture all remaining elements globally
    if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
    }
  }

  renderLiveSiteMath();
});
</script>
{% endif %}
