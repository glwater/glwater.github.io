{% if page.mathjax %}
<!-- MathJax Configuration and Loader (v4) -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      processEscapes: true,
      packages: {'[+]': ['ams', 'noundefined']}
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    loader: {
      load: ['[tex]/ams', '[tex]/noundefined']
    }
  };
</script>
<script async src="https://jsdelivr.net"></script>
{% endif %}

<!-- KaTeX Configuration (Production CDN vs. Local Assets) -->
{% if jekyll.environment == "production" %}
  <!-- Live: Fast CDN delivery for public visitors -->
  <link rel="stylesheet" href="https://jsdelivr.net" crossorigin="anonymous">
  <script defer src="https://jsdelivr.net" crossorigin="anonymous"></script>
{% else %}
  <!-- Local: Uses the cloned assets -->
  <link rel="stylesheet" href="/assets/css/katex.min.css">
  <script defer src="/assets/js/katex.min.js"></script>
{% endif %}

<script>
document.addEventListener("DOMContentLoaded", function() {
  function cleanAndRenderDynamicMath() {
    // Gracefully wait until defer-loaded KaTeX library is fully ready on the window
    if (typeof window.katex === 'undefined') {
      setTimeout(cleanAndRenderDynamicMath, 30);
      return;
    }

    const mathBlocks = document.querySelectorAll('code.language-math');
    
    mathBlocks.forEach((block) => {
      let rawTex = block.textContent.trim();
      if (!rawTex) return;

      // ----- CLEANUP FOR JSDELIVR TYPOS -----
      // Fixes '\f\relax{x}' into standard 'f(x)'
      rawTex = rawTex.replace(/\\f\\relax\{([^}]+)\}/g, 'f($1)');
      // Fixes '\f\hat' into standard '\hat'
      rawTex = rawTex.replace(/\\f\\hat/g, '\\hat');
      // Fixes any loose '\f ' prefixes followed by a space or x, without touching \frac
      rawTex = rawTex.replace(/\\f\s*([xX])/g, 'f$1');
      // ------------------------------------------------

      // Automatically strip legacy notation brackets if present inside the markdown block
      if (rawTex.startsWith('\\(') && rawTex.endsWith('\\)')) {
        rawTex = rawTex.substring(2, rawTex.length - 2).trim();
      }
      if (rawTex.startsWith('\\[') && rawTex.endsWith('\\]')) {
        rawTex = rawTex.substring(2, rawTex.length - 2).trim();
      }

      const container = document.createElement('div');
      container.className = "rendered-markdown-math";
      container.style.textAlign = "center";
      container.style.margin = "1.8rem 0";
      container.style.width = "100%";
      container.style.overflowX = "auto";

      try {
        window.katex.render(rawTex, container, {
          displayMode: true,
          throwOnError: false
        });

        let elementToReplace = block;
        while (elementToReplace.parentElement && 
              (elementToReplace.parentElement.tagName === 'PRE' || 
               elementToReplace.parentElement.classList.contains('highlight') || 
               elementToReplace.parentElement.classList.contains('language-math') ||
               elementToReplace.parentElement.classList.contains('highlighter-rouge'))) {
          elementToReplace = elementToReplace.parentElement;
        }

        elementToReplace.parentNode.replaceChild(container, elementToReplace);
      } catch (err) {
        console.error("Local Math Parser Error: ", err);
      }
    });
  }

  cleanAndRenderDynamicMath();
});
</script>
